[project]
name = "triaj-agent"
version = "0.1.0"
description = "Triaj ingestion agent — LangGraph pipeline (extract → validate → pii_filter → embedding → categorize → persist) with LangSmith tracing."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Triaj contributors" }]

dependencies = [
    "anthropic>=0.45.0",
    "docx2txt>=0.8",
    "langgraph>=1.0.0,<2.0.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langsmith>=0.1.130",
    "pydantic>=2.7,<3.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0.1",
    "supabase>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.55",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triaj_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
